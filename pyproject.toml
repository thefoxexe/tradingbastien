[project]
name = "tradingbastien"
version = "0.1.0"
description = "Bot de trading Bybit (futures perpétuels USDT) — voir docs/SPEC.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pybit>=5.8",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PL", "N"]
ignore = [
    "RUF001", "RUF002", "RUF003", "PLR2004", "E501",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
    "S311",  # random sert au Monte Carlo, pas à la crypto
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["bot", "api", "tests"]

[[tool.mypy.overrides]]
module = ["pybit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["bot", "api"]
branch = true
