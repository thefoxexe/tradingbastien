# Trois services : bot, api (dashboard), db. Aucun port public :
# le dashboard n'écoute que sur l'IP Tailscale (TAILSCALE_IP dans .env).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  bot:
    build: .
    command: ["python", "-m", "bot.main"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
