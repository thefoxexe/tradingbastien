name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - name: Installer Python et les dépendances
        run: |
          uv python install 3.12
          uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typage
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing
      - name: Module de risque à 100 % de couverture
        run: uv run pytest tests/test_risk.py --cov=bot/risk --cov-report=term-missing --cov-fail-under=100
